name: Build and Deploy Snapshot
on:
  push:
    branches:
      - 'main'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-deploy-snapshot:
    name: Build and Deploy Snapshot
    if: ${{ github.repository == 'spring-projects-experimental/stream-source' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Build and Publish
        id: build-and-publish
        uses: ./.github/actions/build
        with:
          publish: true
      - name: Deploy
        uses: spring-io/artifactory-deploy-action@860632611280011966e3f460520dca3733bd9a93 # v0.0.8
        with:
          build-name: 'stream-source-0.x.x'
          folder: 'deployment-repository'
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}
          repository: 'libs-snapshot-local'
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          uri: 'https://repo.spring.io'
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
      - name: Send Notification
        if: always()
        uses: ./.github/actions/send-notification
        with:
          run-name: ${{ format('{0} | Linux | Java 25', github.ref_name) }}
          status: ${{ job.status }}
          webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
    outputs:
      version: ${{ steps.build-and-publish.outputs.version }}
