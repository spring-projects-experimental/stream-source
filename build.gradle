plugins {
	id 'java-library'
	id 'io.spring.nullability' version '0.0.15'
}

apply from: "$rootDir/gradle/multi-release.gradle"
apply from: "$rootDir/gradle/publishing.gradle"

description = 'Stream Source'
group = 'io.spring.streamsource'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/milestone' }
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	api 'org.jspecify:jspecify:1.0.1'
	api 'org.slf4j:slf4j-api:2.0.17'

	testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.reactivestreams:reactive-streams-tck-flow:1.0.4'
	// The `flow` tests use Reactor as a reference Flow implementation.
	testImplementation "io.projectreactor:reactor-core:$reactorVersion"
	testImplementation "io.projectreactor:reactor-test:$reactorVersion"

	testRuntimeOnly "org.apache.logging.log4j:log4j-core:$log4jVersion"
	testRuntimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:$log4jVersion"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitVersion"
	// Runs the TestNG-based Reactive Streams TCK on the JUnit Platform.
	testRuntimeOnly 'org.junit.support:testng-engine:1.1.0'
}

// The library targets a Java 17 baseline: no preview APIs, and nothing newer than 17,
// which compiling against the Java 25 toolchain would otherwise let through.
compileJava {
	options.release = 17
}

test {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

// A separate suite since BlockHound instruments the whole JVM once installed.
testing {
	suites {
		blockhound(JvmTestSuite) {
			useJUnitJupiter(junitVersion)
			dependencies {
				implementation project()
				implementation "io.projectreactor:reactor-core:$reactorVersion"
				implementation 'io.projectreactor.tools:blockhound:1.0.17.RELEASE'
				implementation 'org.assertj:assertj-core:3.27.7'
			}
			targets {
				all {
					testTask.configure {
						jvmArgs '-XX:+AllowRedefinitionToAddDeleteMethods', '-Djdk.attach.allowAttachSelf=true'
					}
				}
			}
		}
	}
}

check {
	dependsOn testing.suites.blockhound
}
